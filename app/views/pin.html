<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Please enter your pin</title>

        <style>
            input::-webkit-outer-spin-button,
            input::-webkit-inner-spin-button {
                -webkit-appearance: none;
                margin: 0;
            }
            
            body {
                font-family: Arial, sans-serif;
                background-color: #f4f4f9;
                margin: 0;
                padding: 0;
                display: flex;
                justify-content: center;
                align-items: center;
                flex-direction: column;
            }

            .misc-pages-header {
                background-color: #E0E5E8;
                padding: 0;
                margin-bottom: 3em;
                font-size: 1.2em;
                color: #000000;
                width: 100vw;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .misc-pages-header h1{
                text-align: center;
                font-size: 3em;
            }

            .misc-pages-header img {
                width: 100px;
            }

            h1 {
                font-size: 24px;
                color: #333;
                margin-bottom: 20px;
            }

            #pin-form {
                display: flex;
                justify-content: center;
                gap: 10px;
                margin-bottom: 20px;
            }

            .pin-input {
                text-align: center;
                width: 50px;
                height: 50px;
                font-size: 24px;
                border: 2px solid #ccc;
                border-radius: 8px;
                transition: border-color 0.3s ease;
            }

            .pin-input:focus {
                border-color: #007bff;
                outline: none;
                box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
            }

            #error {
                color: red;
                font-weight: bold;
                text-align: center;
                margin-top: 10px;
            }

            .container {
                text-align: center;
                background: #fff;
                padding: 30px;
                border-radius: 10px;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
                width: 90%;
                max-width: 400px;
            }
        </style>

        <!-- Must be present for all back to front communication -->
        <script src="./scripts/qwebchannel.js"></script>
        <script src="./scripts/pin.js" defer></script>
    </head>
    <body>
        <div class="misc-pages-header">
            <img src="./icons/piggybank.svg" alt="Piggy bank">  
            <h1>SaveMyPiggy</h1>
            <!-- Piggy bank Icon -->
            <img src="./icons/piggybank.svg" alt="Piggy bank">  
        </div>
        <div class="container">
            <h1>Please Input Your Pin Below</h1>
            <p id="error"></p>

            <form id="pin-form">
                <input class="pin-input" type="number" name="1" id="num1" placeholder="1" autocomplete="off" onkeydown="handleBackspace(event, this, 0)" oninput="moveNext(this, 0)" min="0" required>
                <input class="pin-input" type="number" name="2" id="num2" placeholder="2" autocomplete="off" onkeydown="handleBackspace(event, this, 1)" oninput="moveNext(this, 1)" min="0" required>
                <input class="pin-input" type="number" name="3" id="num3" placeholder="3" autocomplete="off" onkeydown="handleBackspace(event, this, 2)" oninput="moveNext(this, 2)" min="0" required>
                <input class="pin-input" type="number" name="4" id="num4" placeholder="4" autocomplete="off" onkeydown="handleBackspace(event, this, 3)" oninput="moveNext(this, 3)" min="0" required>
            </form>
        </div>

        <script>
            /**
             * Handle when an input box receives a value and move to the next box.
             * @param {HTMLInputElement} input The actual HTML element.
             * @param {Number} index The index of the input box.
             */
            function moveNext(input, index) {
                let inputs = document.querySelectorAll('.pin-input');

                if (input.value.length > 1 || input.value < 0) 
                    return input.value = input.value.slice(1, 2);

                if (input.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                } else if (input.value.length === 0 && index > 0) {
                    inputs[index - 1].focus();
                }

                if(input.id === "num4") {
                    document.getElementById("pin-form").dispatchEvent(new Event("submit", { bubbles: true, cancelable: true }));
                }
            }

            /**
             * Handle backspaces to clear boxes.
             * @param {EventTarget} event The event object.
             * @param {HTMLInputElement} input Input of the current box.
             * @param {Number} index The index of the current box.
             */
            function handleBackspace(event, input, index) {
                let inputs = document.querySelectorAll('.pin-input');

                if (event.key === "Backspace" && input.value.length === 0 && index > 0) {
                    inputs[index - 1].focus();
                    inputs[index - 1].value = "";
                }

                if (event.key === "ArrowLeft") inputs[index - 1].focus();
                if (event.key === "ArrowRight") inputs[index + 1].focus();
            }

            function getPinInt() {
                // Get all four input fields by their IDs
                const num1 = document.getElementById('num1').value;
                const num2 = document.getElementById('num2').value;
                const num3 = document.getElementById('num3').value;
                const num4 = document.getElementById('num4').value;
                
                // Combine the values into a single string or variable
                const pin = String(num1) + String(num2) + String(num3) + String(num4);

                // Optionally, log the pin or use it as needed
                console.log(pin);
                return pin;
            }

            document.getElementById("pin-form").addEventListener("submit", (e) => {
                e.preventDefault();

                handlePinData(getPinInt())
            });
        </script>
    </body>
</html>
